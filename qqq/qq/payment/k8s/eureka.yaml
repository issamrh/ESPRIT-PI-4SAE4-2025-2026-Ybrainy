apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka
  namespace: ybrainy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka
  template:
    metadata:
      labels:
        app: eureka
    spec:
      containers:
        - name: eureka
          image: ybrainy-eureka:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          env:
            - name: EUREKA_PORT
              value: "8761"
---
apiVersion: v1
kind: Service
metadata:
  name: eureka
  namespace: ybrainy
spec:
  selector:
    app: eureka
  ports:
    - name: http
      port: 8761
      targetPort: 8761

