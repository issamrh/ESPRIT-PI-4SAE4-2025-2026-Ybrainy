spring.application.name=event-service
server.port=8081

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/event_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
ybrainy.ai.groq.model=llama-3.3-70b-versatile
ybrainy.ai.groq.api-key=
ybrainy.ai.image.endpoint=https://router.huggingface.co/hf-inference/models/
ybrainy.ai.image.model=stabilityai/stable-diffusion-3-medium-diffusers
ybrainy.ai.image.hf-token=

#ybrainy.ai.gemini.model=gemini-2.0-flash
#ybrainy.ai.gemini.api-key=

# OpenAI text-embedding-3-large Model API (for Recommendation System Embeddings)
github.models.endpoint=https://models.github.ai/inference
github.models.api-key=
github.models.embedding.model=text-embedding-3-large
