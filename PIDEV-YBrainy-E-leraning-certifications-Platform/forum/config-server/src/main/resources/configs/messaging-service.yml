server:
  port: ${FORUM_MESSAGING_PORT:8086}

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/forum_messages?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

upload:
  path: uploads/messages

eureka:
  client:
    service-url:
      defaultZone: ${YBRAINY_EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info
