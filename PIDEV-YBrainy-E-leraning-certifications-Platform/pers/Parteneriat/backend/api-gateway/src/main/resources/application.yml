server:
  port: ${PARTNERSHIP_GATEWAY_PORT:8096}

spring:
  application:
    name: parteneriat-api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: partnership-service
          uri: lb://partnership-service
          predicates:
            - Path=/api/partnerships/**
        - id: job-offer-service
          uri: lb://job-offer-service
          predicates:
            - Path=/api/offers/**
        - id: job-application-service
          uri: lb://job-offer-service
          predicates:
            - Path=/api/applications/**
        - id: job-application-ai-service
          uri: lb://job-offer-service
          predicates:
            - Path=/api/generate-application
        - id: personality-behavior-service-personalities
          uri: lb://personality-behavior-service
          predicates:
            - Path=/api/personalities/**
        - id: personality-behavior-service-behaviors
          uri: lb://personality-behavior-service
          predicates:
            - Path=/api/behaviors/**
        - id: warning-ban-appeal-service-warnings
          uri: lb://warning-ban-appeal-service
          predicates:
            - Path=/api/warnings/**
        - id: warning-ban-appeal-service-appeals
          uri: lb://warning-ban-appeal-service
          predicates:
            - Path=/api/ban-appeals/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"

eureka:
  client:
    service-url:
      defaultZone: ${YBRAINY_EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
