spring.application.name=breadandbutteruser
server.port=${USER_SERVICE_PORT:8899}
spring.datasource.url=${USER_DB_URL:jdbc:h2:mem:breadandbutteruser;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${USER_DB_USERNAME:sa}
spring.datasource.password=${USER_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${USER_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.h2.console.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.diskspace.enabled=false
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_LISTENER_AUTO_STARTUP:false}
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
resilience4j.circuitbreaker.instances.courseServiceClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.courseServiceClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.courseServiceClient.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.forumServiceClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.forumServiceClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.forumServiceClient.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.jobOfferServiceClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.jobOfferServiceClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.jobOfferServiceClient.wait-duration-in-open-state=10s

app.rabbitmq.exchange=${RABBITMQ_EXCHANGE:ybrainy.events}
app.rabbitmq.dead-letter-exchange=${RABBITMQ_DEAD_LETTER_EXCHANGE:ybrainy.events.dlx}
app.rabbitmq.user-created-routing-key=${RABBITMQ_USER_CREATED_ROUTING_KEY:user.created}
app.rabbitmq.user-updated-routing-key=${RABBITMQ_USER_UPDATED_ROUTING_KEY:user.updated}
app.rabbitmq.user-deleted-routing-key=${RABBITMQ_USER_DELETED_ROUTING_KEY:user.deleted}
app.rabbitmq.user-login-routing-key=${RABBITMQ_USER_LOGIN_ROUTING_KEY:user.login}
app.rabbitmq.user-xp-award-queue=${RABBITMQ_USER_XP_AWARD_QUEUE:user.xp.award}
app.rabbitmq.user-xp-award-routing-key=${RABBITMQ_USER_XP_AWARD_ROUTING_KEY:user.xp.award}
app.rabbitmq.user-xp-awarded-routing-key=${RABBITMQ_USER_XP_AWARDED_ROUTING_KEY:user.xp.awarded}
app.rabbitmq.user-level-up-routing-key=${RABBITMQ_USER_LEVEL_UP_ROUTING_KEY:user.level.up}
app.rabbitmq.user-xp-award-dead-letter-queue=${RABBITMQ_USER_XP_AWARD_DLQ:user.xp.award.dlq}
app.rabbitmq.user-xp-award-dead-letter-routing-key=${RABBITMQ_USER_XP_AWARD_DLK:user.xp.award.dead}
app.rabbitmq.retry.max-attempts=${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
app.rabbitmq.retry.initial-interval-ms=${RABBITMQ_RETRY_INITIAL_INTERVAL_MS:1000}
app.rabbitmq.retry.multiplier=${RABBITMQ_RETRY_MULTIPLIER:2.0}
app.rabbitmq.retry.max-interval-ms=${RABBITMQ_RETRY_MAX_INTERVAL_MS:10000}
