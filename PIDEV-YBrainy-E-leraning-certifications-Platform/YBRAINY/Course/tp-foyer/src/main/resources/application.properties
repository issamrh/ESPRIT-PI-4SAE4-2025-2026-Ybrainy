server.port=8082
spring.application.name=course-service

# Eureka Connection
eureka.client.service-url.defaultZone=${YBRAINY_EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.datasource.url=jdbc:mysql://localhost:3306/ybrainy_courses?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

app.file.upload-dir=${FILE_UPLOAD_DIR:/app/uploads}

# JWT Configuration
jwt.secret=${JWT_SECRET:ybrainy-dev-secret-key}

# Stripe
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_51TRXDER51GIV4OEni8qqBt3fOv72ThSj5eBlaTPQEJbjjeZqn4j3PwAti8vM4bUNw8aSgxkwyhqSSOiJaJjnfMWZ00yupYUv3i}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:pk_test_51TRXDER51GIV4OEnRLvu2kso8LoCHmp85V5GaIQVwRxHjlnasdtcj3mGQtJmaHA8JjMlqV5IMx7lMdHW48pO7vVt00Dk7yuzR2}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}
openrouter.api.key=${OPENROUTER_API_KEY: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}

ai.talking-head.base-url=${AI_TALKING_HEAD_BASE_URL:http://localhost:8765}

# ML Microservice
ml.service.url=${ML_SERVICE_URL:http://localhost:5000}

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Config Server
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
# Circuit Breaker (Resilience4j)
spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.timelimiter.configs.default.timeoutDuration=5s

# Distributed Tracing (Zipkin)
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411}/api/v2/spans

# Actuator / Prometheus monitoring
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

