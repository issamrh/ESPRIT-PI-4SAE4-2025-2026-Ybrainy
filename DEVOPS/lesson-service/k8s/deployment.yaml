apiVersion: apps/v1
kind: Deployment
metadata:
  name: lesson-service
  namespace: ybrainy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lesson-service
  template:
    metadata:
      labels:
        app: lesson-service
    spec:
      containers:
        - name: lesson-service
          image: ybrainy/lesson-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
          env:
            - name: SERVER_PORT
              value: "8084"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/ybrainy_lessons?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              value: ""
            - name: EUREKA_CLIENT_ENABLED
              value: "false"
            - name: SPRING_CONFIG_IMPORT
              value: "optional:"
---
apiVersion: v1
kind: Service
metadata:
  name: lesson-service
  namespace: ybrainy
spec:
  selector:
    app: lesson-service
  ports:
    - port: 8084
      targetPort: 8084
      nodePort: 30084
  type: NodePort
