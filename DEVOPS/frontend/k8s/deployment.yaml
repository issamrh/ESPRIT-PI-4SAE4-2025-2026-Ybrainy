apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ybrainy
spec:
  selector:
    app: course-service
  ports:
    - port: 8088
      targetPort: 8082
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-frontend-config
  namespace: ybrainy
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 100m;

        resolver kube-dns.kube-system.svc.cluster.local valid=30s;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            set $gateway "api-gateway.ybrainy.svc.cluster.local";
            proxy_pass         http://$gateway:8088;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /Event/ {
            set $gateway "api-gateway.ybrainy.svc.cluster.local";
            proxy_pass http://$gateway:8088;
            proxy_set_header Host $host;
        }

        location /Inscription/ {
            set $gateway "api-gateway.ybrainy.svc.cluster.local";
            proxy_pass http://$gateway:8088;
            proxy_set_header Host $host;
        }

        location /uploads/ {
            set $gateway "api-gateway.ybrainy.svc.cluster.local";
            proxy_pass http://$gateway:8088;
            proxy_set_header Host $host;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ybrainy
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ybrainy/frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ybrainy
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
