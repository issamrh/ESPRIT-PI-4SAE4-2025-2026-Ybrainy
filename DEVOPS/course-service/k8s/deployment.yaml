apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service
  namespace: ybrainy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: course-service
  template:
    metadata:
      labels:
        app: course-service
    spec:
      containers:
        - name: course-service
          image: ybrainy/course-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
---
apiVersion: v1
kind: Service
metadata:
  name: course-service
  namespace: ybrainy
spec:
  selector:
    app: course-service
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP
