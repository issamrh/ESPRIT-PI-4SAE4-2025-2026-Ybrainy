apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager.monitoring.svc.cluster.local:9093']

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:

      - job_name: 'course-service'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 10s
        static_configs:
          - targets: ['course-service.ybrainy.svc.cluster.local:8082']
            labels:
              service: 'course-service'
              namespace: 'ybrainy'

      - job_name: 'lesson-service'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 10s
        static_configs:
          - targets: ['lesson-service.ybrainy.svc.cluster.local:8084']
            labels:
              service: 'lesson-service'
              namespace: 'ybrainy'

      - job_name: 'quiz-service'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 10s
        static_configs:
          - targets: ['quiz-service.ybrainy.svc.cluster.local:8083']
            labels:
              service: 'quiz-service'
              namespace: 'ybrainy'

      - job_name: 'enrollment-service'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 10s
        static_configs:
          - targets: ['enrollment-service.ybrainy.svc.cluster.local:8085']
            labels:
              service: 'enrollment-service'
              namespace: 'ybrainy'

      - job_name: 'jenkins'
        metrics_path: '/prometheus'
        static_configs:
          - targets: ['172.22.108.68:8086']
            labels:
              service: 'jenkins'

      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

  rules.yml: |
    groups:
      - name: ybrainy-service-alerts
        interval: 30s
        rules:

          - alert: ServiceDown
            expr: up{job=~"course-service|lesson-service|quiz-service|enrollment-service"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "YBrainy service {{ $labels.service }} is DOWN"
              description: "{{ $labels.service }} has been unreachable for more than 1 minute."

          - alert: HighMemoryUsage
            expr: |
              jvm_memory_used_bytes{area="heap",job=~"course-service|lesson-service|quiz-service|enrollment-service"}
              /
              jvm_memory_max_bytes{area="heap",job=~"course-service|lesson-service|quiz-service|enrollment-service"}
              > 0.85
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High JVM heap usage on {{ $labels.service }}"
              description: "{{ $labels.service }} heap is above 85% for 2 minutes."

          - alert: HighErrorRate
            expr: |
              rate(http_server_requests_seconds_count{status=~"5..",job=~"course-service|lesson-service|quiz-service|enrollment-service"}[5m]) > 0.1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High HTTP 5xx error rate on {{ $labels.service }}"
              description: "{{ $labels.service }} is returning more than 0.1 errors/s."

          - alert: SlowResponseTime
            expr: |
              histogram_quantile(0.95,
                rate(http_server_requests_seconds_bucket{job=~"course-service|lesson-service|quiz-service|enrollment-service"}[5m])
              ) > 2
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "Slow p95 response time on {{ $labels.service }}"
              description: "{{ $labels.service }} p95 latency is above 2s for 3 minutes."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=7d'
            - '--web.enable-lifecycle'
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
  type: NodePort
