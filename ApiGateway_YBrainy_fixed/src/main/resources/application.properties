spring.application.name=ApiGateway_YBrainy
server.port=8084

# Routes
spring.cloud.gateway.mvc.routes[0].id=event-service
spring.cloud.gateway.mvc.routes[0].uri=lb://event-service
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/Event/**

spring.cloud.gateway.mvc.routes[1].id=inscription-service
spring.cloud.gateway.mvc.routes[1].uri=lb://inscription-service
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/Inscription/**

spring.cloud.gateway.mvc.routes[2].id=user-service
spring.cloud.gateway.mvc.routes[2].uri=lb://user-service
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/User/**

spring.cloud.gateway.mvc.routes[3].id=feedback-service
spring.cloud.gateway.mvc.routes[3].uri=lb://feedback-service
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/Feedback/**

# Eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
