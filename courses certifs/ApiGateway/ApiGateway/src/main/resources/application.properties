spring.application.name=api-gateway
server.port=8089

# 1. Eureka Connection
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# 2. Automatic Routing (Discovery Locator)
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# 3. Manual Route Fix
spring.cloud.gateway.routes[0].id=course-service
spring.cloud.gateway.routes[0].uri=lb://course-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/courses/**
# Add this to ensure the path isn't being manipulated unexpectedly
spring.cloud.gateway.routes[0].order=1

spring.cloud.gateway.routes[1].id=enrollment-service
spring.cloud.gateway.routes[1].uri=lb://course-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/enrollments/**
spring.cloud.gateway.routes[1].order=1

spring.cloud.gateway.routes[2].id=payment-service
spring.cloud.gateway.routes[2].uri=lb://course-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.routes[2].order=1

spring.cloud.gateway.routes[3].id=learning-path-service
spring.cloud.gateway.routes[3].uri=lb://course-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/learning-paths/**
spring.cloud.gateway.routes[3].order=1

spring.cloud.gateway.routes[4].id=student-dashboard
spring.cloud.gateway.routes[4].uri=lb://course-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/students/**
spring.cloud.gateway.routes[4].order=1

spring.cloud.gateway.routes[5].id=instructor-analytics
spring.cloud.gateway.routes[5].uri=lb://course-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/instructor/**
spring.cloud.gateway.routes[5].order=1

spring.cloud.gateway.routes[6].id=ml-service
spring.cloud.gateway.routes[6].uri=lb://course-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/ml/**
spring.cloud.gateway.routes[6].order=1

# Global CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations[/**].allowedOriginPatterns=http://localhost:*,http://127.0.0.1:*
spring.cloud.gateway.globalcors.cors-configurations[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations[/**].maxAge=3600

# Remove X-Frame-Options to allow PDFs to display in iframes
spring.cloud.gateway.default-filters=RemoveResponseHeader=X-Frame-Options