<!-- ─────────────────────────────────────────────────────────────────
     DROP-IN REPLACEMENT for the <div class="head-right"> block in
     your existing header.component.html
     ──────────────────────────────────────────────────────────────── -->

<div class="head-right">
  <div class="menuBtn">

    <!-- ── AUTHENTICATED STATE ── -->
    <div *ngIf="authenticated" class="auth-controls">

      <!-- Profile Avatar Button (opens dropdown) -->
      <div class="profile-menu-wrapper" (clickOutside)="profileOpen = false">
        <button
          class="profile-avatar-btn"
          (click)="profileOpen = !profileOpen"
          [attr.aria-expanded]="profileOpen"
          aria-label="Open profile menu"
        >
          <img
            *ngIf="profilePicture"
            [src]="profilePicture"
            class="profile-avatar-img"
            alt="Profile"
          />
          <span *ngIf="!profilePicture" class="profile-avatar-initials">
            {{ getInitials() }}
          </span>
          <!-- Status dot -->
          <span class="profile-status-dot" [ngClass]="'dot-' + (userStatus | lowercase)"></span>
        </button>

        <!-- Dropdown Panel -->
        <div class="profile-dropdown" [class.open]="profileOpen">

          <!-- User summary row -->
          <div class="pd-header">
            <div class="pd-avatar">
              <img *ngIf="profilePicture" [src]="profilePicture" alt="" />
              <span *ngIf="!profilePicture">{{ getInitials() }}</span>
            </div>
            <div class="pd-info">
              <span class="pd-name">{{ displayName }}</span>
              <span class="pd-role">{{ userRole }}</span>
            </div>
          </div>

          <div class="pd-divider"></div>

          <!-- Menu items -->
          <nav class="pd-nav">
            <a routerLink="/profile" (click)="profileOpen = false" class="pd-item">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
              </svg>
              My Profile
            </a>
            <a routerLink="/settings" (click)="profileOpen = false" class="pd-item">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
              Settings
            </a>
            <a routerLink="/courses" (click)="profileOpen = false" class="pd-item">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
              </svg>
              My Courses
            </a>

            <!-- Streak badge -->
            <div class="pd-streak">
              <span>🔥</span>
              <span class="pd-streak-text"><strong>{{ streakDays }}</strong>-day learning streak</span>
            </div>
          </nav>

          <div class="pd-divider"></div>

          <!-- Sign out -->
          <button class="pd-item pd-signout" (click)="onLogout()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Sign Out
          </button>
        </div>
      </div>

    </div>

    <!-- ── GUEST STATE ── -->
    <a *ngIf="!authenticated" routerLink="/login" class="button line">
      Sign in
    </a>

    <a routerLink="/" class="button line">Get In Touch</a>

    <div class="menu side-menu">
      <a href="javascript:void(0)" class="js-nav-toggle" (click)="toggleMenu()">
        <span></span>
      </a>
    </div>
  </div>
</div>


<!-- ─────────────────────────────────────────────────────────────────
     CSS — add to header.component.css
     ──────────────────────────────────────────────────────────────── -->
<style>
/* Profile avatar trigger button */
.auth-controls {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  margin-right: 12px;
}

.profile-menu-wrapper {
  position: relative;
}

.profile-avatar-btn {
  position: relative;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.25);
  cursor: pointer;
  padding: 0;
  background: transparent;
  outline: none;
  transition: border-color .2s, transform .2s;
  overflow: visible;
}

.profile-avatar-btn:hover {
  border-color: #0a6ef5;
  transform: scale(1.06);
}

.profile-avatar-img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}

.profile-avatar-initials {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: linear-gradient(135deg, #0a6ef5, #00d4aa);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 800;
  color: white;
  letter-spacing: -.5px;
}

/* Status dot on avatar */
.profile-status-dot {
  position: absolute;
  bottom: 1px;
  right: 1px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 2px solid #fff;
  background: #10b981;
}
.dot-warned    { background: #f59e0b; }
.dot-suspended { background: #ef4444; }
.dot-flagged   { background: #8b5cf6; }

/* ── Dropdown Panel ── */
.profile-dropdown {
  position: absolute;
  top: calc(100% + 12px);
  right: 0;
  width: 240px;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  box-shadow: 0 16px 48px rgba(15,23,41,.16), 0 4px 16px rgba(15,23,41,.08);
  opacity: 0;
  transform: translateY(-8px) scale(.97);
  pointer-events: none;
  transition: opacity .2s, transform .2s cubic-bezier(.34,1.56,.64,1);
  z-index: 9999;
  overflow: hidden;
}

.profile-dropdown.open {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: all;
}

/* Dropdown header */
.pd-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 16px 14px;
}

.pd-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #0a6ef5, #00d4aa);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 800;
  color: white;
  flex-shrink: 0;
  overflow: hidden;
}

.pd-avatar img { width: 100%; height: 100%; object-fit: cover; }

.pd-info {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.pd-name {
  font-size: 13.5px;
  font-weight: 700;
  color: #0f1729;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pd-role {
  font-size: 11px;
  color: #7a8fa8;
  text-transform: uppercase;
  letter-spacing: .5px;
  font-weight: 600;
}

.pd-divider {
  height: 1px;
  background: #e2e8f0;
  margin: 0;
}

/* Nav items */
.pd-nav {
  padding: 8px 6px;
}

.pd-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 12px;
  border-radius: 8px;
  font-size: 13.5px;
  font-weight: 500;
  color: #3d4f6b;
  text-decoration: none;
  background: transparent;
  border: none;
  cursor: pointer;
  text-align: left;
  transition: background .15s, color .15s;
}

.pd-item:hover {
  background: #f0f5ff;
  color: #0a6ef5;
}

.pd-item svg { flex-shrink: 0; color: #7a8fa8; }
.pd-item:hover svg { color: #0a6ef5; }

/* Streak */
.pd-streak {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  margin: 4px 0;
  background: #fffbeb;
  border-radius: 8px;
  font-size: 12px;
}
.pd-streak-text { color: #92400e; }
.pd-streak-text strong { color: #d97706; }

/* Sign out */
.pd-signout {
  margin: 6px 6px 8px;
  width: calc(100% - 12px);
  color: #e53e3e;
  font-weight: 600;
}
.pd-signout:hover { background: #fff5f5; color: #c53030; }
.pd-signout svg { color: #e53e3e; }
</style>
