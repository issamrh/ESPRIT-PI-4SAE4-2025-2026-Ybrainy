spring.application.name=api-gateway
server.port=8088

# 1. Eureka Connection
eureka.client.service-url.defaultZone=http://localhost:8071/eureka/

# 2. Automatic Routing (Discovery Locator)
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# 3. Manual Route Fix
spring.cloud.gateway.routes[0].id=course-service
spring.cloud.gateway.routes[0].uri=lb://course-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/courses/**
# Add this to ensure the path isn't being manipulated unexpectedly
spring.cloud.gateway.routes[0].order=1

spring.cloud.gateway.routes[1].id=breadandbutteruser-tracking
spring.cloud.gateway.routes[1].uri=lb://breadandbutteruser
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/tracking/**
spring.cloud.gateway.routes[1].order=2

spring.cloud.gateway.routes[2].id=breadandbutteruser-auth
spring.cloud.gateway.routes[2].uri=lb://breadandbutteruser
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[2].order=3

spring.cloud.gateway.routes[3].id=breadandbutteruser-users
spring.cloud.gateway.routes[3].uri=lb://breadandbutteruser
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[3].order=4

spring.cloud.gateway.routes[4].id=breadandbutteruser-warnings
spring.cloud.gateway.routes[4].uri=lb://breadandbutteruser
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/warnings/**
spring.cloud.gateway.routes[4].order=5

spring.cloud.gateway.routes[5].id=breadandbutteruser-ban-appeals
spring.cloud.gateway.routes[5].uri=lb://breadandbutteruser
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/ban-appeals/**
spring.cloud.gateway.routes[5].order=6

# Global CORS Configuration for API Gateway
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9190/realms/microservices
keycloak.auth.client-id=${KEYCLOAK_AUTH_CLIENT_ID:angular-client}
