<div class="us-root">

  <!-- Panel (hidden by default, toggled via FAB or Ctrl+U) -->
  <div class="us-panel" [class.us-panel-visible]="visible">

    <div class="us-header">
      <span class="us-title">Switch User</span>
      <kbd class="us-shortcut">Ctrl+U</kbd>
    </div>

    <div class="us-users">
      <button
        *ngFor="let u of users"
        type="button"
        class="us-card"
        [class.us-card-active]="currentUser !== null && currentUser!.id === u.id"
        (click)="switch(u.id)">
        <span class="us-avatar">{{ u.name.charAt(0) }}</span>
        <span class="us-info">
          <span class="us-name">{{ u.name }}</span>
          <span class="us-uid">ID: {{ u.id }}</span>
        </span>
        <span class="us-badge" [ngClass]="roleClass(u.role)">{{ u.role }}</span>
      </button>
    </div>

  </div>

  <!-- FAB (always visible) -->
  <button
    type="button"
    class="us-fab"
    (click)="visible = !visible"
    [title]="currentUser ? 'Switch user (Ctrl+U) — ' + currentUser.name : 'No user selected (Ctrl+U)'">
    <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="7" cy="7" r="3.5"/>
      <path d="M1 17c0-3.3 2.7-6 6-6"/>
      <circle cx="14" cy="12" r="3"/>
      <path d="M11 18.5c0-2.2 1.3-4 3-4s3 1.8 3 4"/>
    </svg>
    <span *ngIf="currentUser" class="us-fab-role" [ngClass]="roleClass(currentUser.role)">
      {{ currentUser.role.charAt(0) }}
    </span>
  </button>

</div>
