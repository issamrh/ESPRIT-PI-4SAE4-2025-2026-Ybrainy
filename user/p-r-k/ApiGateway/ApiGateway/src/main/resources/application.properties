spring.application.name=api-gateway
server.port=8088

# 1. Eureka Connection
eureka.client.service-url.defaultZone=http://localhost:8071/eureka/

# 2. Automatic Routing (Discovery Locator)
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# 3. Manual Route Fix
spring.cloud.gateway.routes[0].id=course-service
spring.cloud.gateway.routes[0].uri=lb://course-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/courses/**
# Add this to ensure the path isn't being manipulated unexpectedly
spring.cloud.gateway.routes[0].order=1

spring.cloud.gateway.routes[1].id=breadandbutteruser-tracking
spring.cloud.gateway.routes[1].uri=lb://breadandbutteruser
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/tracking/**
spring.cloud.gateway.routes[1].order=2

spring.cloud.gateway.routes[2].id=breadandbutteruser-auth
spring.cloud.gateway.routes[2].uri=lb://breadandbutteruser
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[2].order=3

spring.cloud.gateway.routes[3].id=breadandbutteruser-users
spring.cloud.gateway.routes[3].uri=lb://breadandbutteruser
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[3].order=4

spring.cloud.gateway.routes[4].id=breadandbutteruser-warnings
spring.cloud.gateway.routes[4].uri=lb://breadandbutteruser
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/warnings/**
spring.cloud.gateway.routes[4].order=5

spring.cloud.gateway.routes[5].id=breadandbutteruser-ban-appeals
spring.cloud.gateway.routes[5].uri=lb://breadandbutteruser
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/ban-appeals,/api/ban-appeals/**
spring.cloud.gateway.routes[5].order=6

spring.cloud.gateway.routes[6].id=course-enrollment-service
spring.cloud.gateway.routes[6].uri=lb://course-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/enrollments/**
spring.cloud.gateway.routes[6].order=7

spring.cloud.gateway.routes[7].id=course-payment-service
spring.cloud.gateway.routes[7].uri=lb://course-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.routes[7].order=8

spring.cloud.gateway.routes[8].id=course-learning-paths
spring.cloud.gateway.routes[8].uri=lb://course-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/learning-paths/**
spring.cloud.gateway.routes[8].order=9

spring.cloud.gateway.routes[9].id=course-instructor
spring.cloud.gateway.routes[9].uri=lb://course-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/instructor/**
spring.cloud.gateway.routes[9].order=10

spring.cloud.gateway.routes[10].id=course-students
spring.cloud.gateway.routes[10].uri=lb://course-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/students/**
spring.cloud.gateway.routes[10].order=11

spring.cloud.gateway.routes[11].id=course-ml
spring.cloud.gateway.routes[11].uri=lb://course-service
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/ml/**
spring.cloud.gateway.routes[11].order=12

spring.cloud.gateway.routes[12].id=quiz-service
spring.cloud.gateway.routes[12].uri=lb://quiz-service
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/quizzes/**
spring.cloud.gateway.routes[12].order=13

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9190/realms/microservices
keycloak.auth.client-id=${KEYCLOAK_AUTH_CLIENT_ID:angular-client}
spring.codec.max-in-memory-size=50MB
